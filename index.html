<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Apply the light/dark theme class BEFORE the first paint so there's
      no flash of the wrong palette on cold load. Reads localStorage
      first, then falls back to the OS preference. Source of truth for
      the React-side hook is the `light` class on this <html> element
      (see src/lib/useTheme.ts).

      Admin / configurator / reference routes are forced dark — they
      contain dark-only styling and host Radix portals that render
      outside the page's `.dark-region` wrapper. The matching React-side
      enforcement lives in src/lib/useForceDark.ts.
    -->
    <script>
      (function () {
        try {
          var path = window.location.pathname || "";
          var forceDark =
            path === "/admin" ||
            path.indexOf("/admin/") === 0 ||
            path.indexOf("/reference/") === 0;
          if (forceDark) return;

          var stored = window.localStorage.getItem("hudson-theme");
          var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          if (stored === "light" || (!stored && prefersLight)) {
            document.documentElement.classList.add("light");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      /* Cover the period between this <head> running and the JS bundle
         loading. The CSS-var-driven body background still applies after,
         but this avoids a black or white strip at the top of the page
         on slow networks. */
      :root { background-color: #09090b; }
      html.light { background-color: #f5f5f5; }
    </style>
